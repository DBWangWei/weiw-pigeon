# Copy beside a Typst or PDF input as pigeon.toml. CLI options take precedence.
graph = "local"
graph_provider = "codex-config"
title_effect = "text-type"
slide_transition = "camera"
# Omit output to use pigeon-FILENAME beside each input.
# output = "my-presentation"
no_zip = true

# Optional: paths are relative to this file.
# navigation = "slides.navigation.json"
# deck_id = "my-talk"
# title = "My presentation"

# Local voice needs an explicit Start click; see voice.md for helper installation.
# --voice / --no-voice override enabled; manual semantic actions remain available.
[voice]
backend = "whisper" # optional "browser" uses Chrome's on-device language pack
enabled = true
lang = "en-US"
boost = 3
cooldown_ms = 3000
stale_ms = 600
resuppress_after_dismiss_ms = 10000
restart_delay_ms = 250
watchdog_ms = 90000
pop_pad_pt = 6
pop_max_fraction = 0.85
pop_max_scale = 4
auto_close_ms = 0

# Live presenter Q&A. Mark the authored Q&A area with pigeon-sem("_qa", ...).
[qa]
enabled = true
target = "_qa"
model = "gpt-4.1-mini"
max_length = 4000
max_items = 50

# Omit rules for the default takeaway/table/figure/example rules.
# rules = [] # Explicitly remove all rules.
# Supplying one or more [[voice.rules]] replaces the defaults:
# [[voice.rules]]
# id = "result"
# phrases = ["main result"]
# target = "takeaway"
# action = "pop"
# multi = "stack"

# Semantic tiers: see semantic-tiers.md. Omit presets for built-in result/flat.
[tiers]
mode = "slide"
default_preset = "result"
