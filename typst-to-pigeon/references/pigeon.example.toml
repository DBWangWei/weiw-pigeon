# Copy beside a Typst or PDF input as pigeon.toml. CLI options take precedence.
graph = "local"
graph_provider = "codex-config"
title_effect = "none" # omit extra title SVGs
embed_pdf = false # set true to embed the source PDF in the HTML
png_size = "768p" # 1366x768; also 1080p (1920x1080) or original
png_to_jpg = true # set false to keep PNG payloads
jpg_quality = 90 # 1-100
slide_transition = "camera"
# Omit output to use pigeon-FILENAME.html beside each input.
# Choose "multiple" or "zip" below for voice and live Q&A.
out_mode = "single"
# output = "my-presentation.html" # use a directory path for multiple/zip

# Motion effects. Particle morph defaults to slide changes between sections.
# Set particle_morph_slides to destination slide IDs to choose exact slides.
[effects]
particle_morph = "sections" # sections, all, or none
particle_morph_slides = []
particle_morph_duration_ms = 1400
particle_morph_cell = 10
rack_focus = false # can also be enabled from Overview > Motion effects

# Optional: paths are relative to this file.
# navigation = "slides.navigation.json"
# deck_id = "my-talk"
# title = "My presentation"

# Local voice requires out_mode = "multiple" or "zip" and an explicit Start click.
# See voice.md for helper installation. Single-file output excludes voice/Q&A.
# --voice / --no-voice override enabled; manual semantic actions remain available.
[voice]
backend = "whisper" # optional "browser" uses Chrome's on-device language pack
enabled = true
lang = "en-US"
boost = 3
cooldown_ms = 3000
stale_ms = 600
resuppress_after_dismiss_ms = 10000
restart_delay_ms = 250
watchdog_ms = 90000
pop_pad_pt = 6
pop_max_fraction = 0.85
pop_max_scale = 4
auto_close_ms = 0

# Live presenter Q&A. Mark the authored Q&A area with pigeon-sem("_qa", ...).
[qa]
enabled = true
target = "_qa"
model = "qwen3.7-flash"
max_length = 4000
max_items = 50

# Omit rules for the default takeaway/table/figure/example rules.
# rules = [] # Explicitly remove all rules.
# Supplying one or more [[voice.rules]] replaces the defaults:
# [[voice.rules]]
# id = "result"
# phrases = ["main result"]
# target = "takeaway"
# action = "pop"
# multi = "stack"

# Semantic tiers: see semantic-tiers.md. Omit presets for built-in result/flat.
[tiers]
mode = "slide"
default_preset = "result"
