<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460">
  <rect width="1200" height="460" rx="18" fill="#F7FAFB"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#007E87"/>
    </marker>
    <marker id="learning-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#7455A6"/>
    </marker>
  </defs>
  <g font-family="Arial">
    <text x="600" y="38" text-anchor="middle" font-size="25" font-weight="700" fill="#172C43">personalization becomes a control loop, not a topic label</text>

    <rect x="42" y="92" width="280" height="100" rx="12" fill="#EAF0F6" stroke="#416782" stroke-width="3"/>
    <text x="182" y="130" text-anchor="middle" font-size="23" font-weight="700" fill="#416782">fine-grained trace</text>
    <text x="182" y="160" text-anchor="middle" font-size="18" fill="#172C43">attempts, errors, questions</text>

    <circle cx="600" cy="175" r="78" fill="#EDF5F5" stroke="#007E87" stroke-width="4"/>
    <text x="600" y="168" text-anchor="middle" font-size="25" font-weight="700" fill="#007E87">learner state</text>
    <text x="600" y="199" text-anchor="middle" font-size="19" fill="#172C43">reasoning, effort, response</text>

    <rect x="878" y="92" width="280" height="100" rx="12" fill="#FFF6E7" stroke="#C77919" stroke-width="3"/>
    <text x="1018" y="130" text-anchor="middle" font-size="23" font-weight="700" fill="#C77919">next action</text>
    <text x="1018" y="160" text-anchor="middle" font-size="18" fill="#172C43">material, exercise, schedule</text>

    <rect x="400" y="330" width="400" height="90" rx="12" fill="#F3F0FA" stroke="#7455A6" stroke-width="3"/>
    <text x="600" y="366" text-anchor="middle" font-size="24" font-weight="700" fill="#7455A6">reward</text>
    <text x="600" y="396" text-anchor="middle" font-size="17" fill="#172C43">extrinsic (passive + proactive) + intrinsic</text>

    <!-- State produces the trace and selects the next action. -->
    <line x1="522" y1="150" x2="322" y2="140" stroke="#007E87" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="678" y1="150" x2="878" y2="140" stroke="#007E87" stroke-width="4" marker-end="url(#arrow)"/>

    <!-- Trace, state, and action all contribute to the reward. -->
    <line x1="250" y1="192" x2="425" y2="338" stroke="#007E87" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="600" y1="253" x2="600" y2="330" stroke="#007E87" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="950" y1="192" x2="775" y2="338" stroke="#007E87" stroke-width="4" marker-end="url(#arrow)"/>

    <!-- The learning step updates the learner state. -->
    <path d="M470 375 C310 455 275 260 522 205" fill="none" stroke="#7455A6" stroke-width="4" marker-end="url(#learning-arrow)"/>
    <rect x="292" y="418" width="116" height="26" rx="5" fill="#F7FAFB"/>
    <text x="350" y="437" text-anchor="middle" font-size="18" font-weight="700" fill="#7455A6">learning step</text>
  </g>
</svg>
