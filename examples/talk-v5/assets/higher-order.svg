<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <rect width="1200" height="320" rx="18" fill="#F7FAFB"/>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#007E87"/></marker></defs>
  <g font-family="Arial" text-anchor="middle">
    <line x1="135" y1="145" x2="1050" y2="145" stroke="#9CB3BE" stroke-width="5" marker-end="url(#arrow)"/>
    <circle cx="140" cy="145" r="54" fill="#FCEDEA" stroke="#B6504A" stroke-width="4"/>
    <circle cx="360" cy="145" r="54" fill="#FFF6E7" stroke="#C77919" stroke-width="4"/>
    <circle cx="580" cy="145" r="54" fill="#EDF5F5" stroke="#007E87" stroke-width="4"/>
    <circle cx="800" cy="145" r="54" fill="#EAF0F6" stroke="#416782" stroke-width="4"/>
    <circle cx="1020" cy="145" r="54" fill="#F3F0FA" stroke="#7455A6" stroke-width="4"/>
    <text x="140" y="135" font-size="22" font-weight="700" fill="#B6504A">attempt</text><text x="140" y="164" font-size="18" fill="#172C43">unaided</text>
    <text x="360" y="135" font-size="22" font-weight="700" fill="#C77919">propose</text><text x="360" y="164" font-size="18" fill="#172C43">alternatives</text>
    <text x="580" y="135" font-size="22" font-weight="700" fill="#007E87">critique</text><text x="580" y="164" font-size="18" fill="#172C43">assumptions</text>
    <text x="800" y="135" font-size="22" font-weight="700" fill="#416782">verify</text><text x="800" y="164" font-size="18" fill="#172C43">evidence</text>
    <text x="1020" y="135" font-size="22" font-weight="700" fill="#7455A6">transfer</text><text x="1020" y="164" font-size="18" fill="#172C43">innovate</text>
    <text x="600" y="65" font-size="25" font-weight="700" fill="#172C43">higher-order capability is a sequence of practices</text>
    <text x="600" y="255" font-size="22" fill="#516071">AI can challenge every step; it cannot be the student's only source of judgment.</text>
  </g>
</svg>
