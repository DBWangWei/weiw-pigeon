graph = "lexical"
no_zip = false

[qa]
enabled = true
target = "_qa"
model = "gpt-4.1-mini"
max_length = 4000
max_items = 50

[voice]
backend = "whisper"
lang = "en-US"

[[voice.rules]]
id = "takeaway"
phrases = ["key message", "key messages", "takeaway", "takeaways", "take-away message", "take away message", "conclusion", "conclusions"]
target = "takeaway"
action = "pop"
multi = "stack"

[[voice.rules]]
id = "table"
phrases = ["this table", "show the table"]
target = "_table"
action = "focus"
multi = "ask"

[[voice.rules]]
id = "figure"
phrases = ["this figure", "this plot", "show the diagram"]
target = "_fig"
action = "spotlight"
multi = "ask"

[[voice.rules]]
id = "example"
phrases = ["this example", "work through this example"]
target = "_example"
action = "pop"
multi = "ask"

[[voice.commands]]
id = "next-page"
phrases = ["next page"]
command = "next_page"

[[voice.commands]]
id = "previous-page"
phrases = ["previous page"]
command = "previous_page"

[[voice.commands]]
id = "go-to-page"
phrases = ["go to page"]
command = "go_to_page"

[[voice.commands]]
id = "full-screen"
phrases = ["full screen", "fullscreen"]
command = "fullscreen"

[[voice.commands]]
id = "overview"
phrases = ["go to overview"]
command = "overview"

[[voice.commands]]
id = "graph-view"
phrases = ["go to graph view"]
command = "graph"

[[voice.commands]]
id = "pen-mode"
phrases = ["pen mode"]
command = "pen"

[[voice.commands]]
id = "highlight-mode"
phrases = ["highlight mode"]
command = "highlighter"

[[voice.commands]]
id = "wand-mode"
phrases = ["wand mode"]
command = "wand"

[[voice.commands]]
id = "diagram-mode"
phrases = ["diagram mode"]
command = "diagram"

[[voice.commands]]
id = "default-mode"
phrases = ["default mode"]
command = "navigate"

[[voice.commands]]
id = "qa-start"
phrases = ["take questions now", "take any questions now"]
command = "qa_start"
